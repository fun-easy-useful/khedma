<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خِدمة — خدمات قريبة منك</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#5B4BDB"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/></head><body><div id="app"><header class="topbar"><div class="brand"><span class="logo">خ</span><span>خِدمة</span></div><nav><button data-page="home" class="nav-btn active">الرئيسية</button><button data-page="services" class="nav-btn">الخدمات</button><button data-page="requests" class="nav-btn">طلباتي</button><button data-page="provider" class="nav-btn">مقدم الخدمة</button></nav><div class="country-wrap"><select id="countrySelect"><option value="ma">🇲🇦 المغرب</option><option value="cn">🇨🇳 中国</option><option value="jp">🇯🇵 日本</option><option value="us">🇺🇸 USA</option><option value="in">🇮🇳 भारत</option></select></div><div class="language-wrap"><select id="languageSelect"><option value="ar">العربية</option><option value="ary">الدارجة المغربية</option><option value="fr">Français</option><option value="en">English</option><option value="zh">中文</option><option value="ja">日本語</option><option value="hi">हिन्दी</option></select></div></header><main><section id="home" class="page active"><div class="hero"><div><span class="eyebrow">خدمات محلية بسهولة</span><h1>محتاج خدمة؟<br><strong>نوصلك بالشخص المناسب.</strong></h1><p>قلب على مول الخدمات لي قراب ليك، قارن التقييمات والثمن، وحجز فدقايق.</p><button class="primary" id="startRequest">طلب خدمة دابا ←</button></div><div class="hero-card"><div class="map-dot"></div><div class="floating-card one"><b>📍 قراب ليك</b></div><div class="map-grid"></div></div></div><div class="section-head"><h2>شنو محتاج؟</h2></div><div class="categories" id="homeCategories"></div></section><section id="services" class="page"><div class="page-title"><h1>الخدمات</h1><div class="search">⌕<input id="serviceSearch" placeholder="قلب على خدمة..."></div></div><div class="categories large" id="allCategories"></div></section><section id="request" class="page"><div class="form-wrap"><button class="back" data-page="home">→ رجع</button><span class="eyebrow">طلب جديد</span><h1>شنو الخدمة لي محتاج؟</h1><p class="muted">دخل التفاصيل ونعاونوك تلقى مول الخدمة المناسب.</p><form id="requestForm"><label>نوع الخدمة<select id="requestCategory" required></select></label><label>شرح المشكل<textarea id="requestDescription" rows="4" required></textarea></label><label>المكان<input id="requestLocation" required value="الدار البيضاء"></label><div id="locationMap" class="location-map"></div><div class="map-actions"><button type="button" class="secondary" id="useLocation">📍 استعمل موقعي</button><span id="locationStatus" class="muted"></span></div><label>الثمن المقترح<input id="requestBudget" type="number" min="0"></label><button class="primary full" type="submit">صيفط الطلب</button></form></div></section><section id="requests" class="page"><div class="page-title"><h1>طلباتي</h1></div><div id="requestList"></div></section><section id="provider" class="page"><div class="page-title"><h1>الطلبات المتوفرة</h1></div><div id="providerList"></div></section></main><div id="toast" class="toast"></div><footer>© 2026 خِدمة</footer></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script src="app.js"></script><script src="location.js"></script><script src="pricing.js"></script></body></html>
